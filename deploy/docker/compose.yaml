# 锐消 RedactX：Docker 部署（Docker Compose v2）。镜像与 Apple container 部署共用 deploy/container/Containerfile。
#   构建前先导出正文人名识别模型：.venv/bin/python deploy/ner_export.py（写入 models/ner/）
#   cp deploy/docker/.env.example deploy/docker/.env   # 填写管理员 Key 等
#   docker compose -f deploy/docker/compose.yaml up -d --build
#   deploy/keys.sh keys create "名称"                    # 生成用户 Key（自动识别 Docker）
name: redactx

services:
  redactx:
    build:
      context: ../..
      dockerfile: deploy/container/Containerfile
    image: redactx:local
    container_name: ${REDACTX_CONTAINER:-redactx-oss}
    restart: unless-stopped
    # 只绑定本机回环地址；需要给其他机器用时放在反向代理或隧道后面，并务必设置 API Key
    ports:
      - "127.0.0.1:${REDACTX_PORT:-8090}:8000"
    environment:
      REDACTX_API_KEY: ${REDACTX_API_KEY:-}
      REDACTX_ALLOW_EXPORT: ${REDACTX_ALLOW_EXPORT:-}
      REDACTX_REQUIRE_SANDBOX: ${REDACTX_REQUIRE_SANDBOX:-}
      REDACTX_PAGE_WORKERS: ${REDACTX_PAGE_WORKERS:-2}
      REDACTX_RETENTION_HOURS: ${REDACTX_RETENTION_HOURS:-24}
    # 数据（任务结果、预览、库）放在命名卷里：继承镜像里 /data 的属主（非 root 用户 10001），宿主机目录挂载会因属主不对写不进去
    volumes:
      - redactx-data:/data
    # 加固：根文件系统只读（可写的只有数据卷与 /tmp）、去掉全部 Linux 能力、禁止提权
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 6g
    cpus: 6

volumes:
  redactx-data:
