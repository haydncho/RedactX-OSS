name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]"
          pip uninstall -y opencv-python || true
          pip install --force-reinstall --no-deps "opencv-python-headless>=4.10"
      - name: Test
        run: pytest -q
