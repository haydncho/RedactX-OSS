[project]
name = "redactx"
version = "0.1.9"
description = "锐消 RedactX：病案等文档的本地脱敏服务"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pypdfium2>=4.30",
  "pikepdf>=9.0",
  "img2pdf>=0.5",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "pillow>=10.4",
  "rapidfuzz>=3.9",
  "rapidocr>=3.4",
  "onnxruntime>=1.19",
  "tokenizers>=0.19",
  "markdown>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# 合成评估集（bench/）：字体子集化
bench = ["fonttools>=4.50"]
# 导出正文人名识别模型（deploy/ner_export.py），只在准备模型时用，运行时不需要
ner-export = ["torch>=2.2", "transformers>=4.40", "huggingface_hub>=0.23", "onnx>=1.16"]

[tool.setuptools]
packages = ["redactx", "redactx.detect", "service"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# 测试会导入仓库根目录下的 bench/（评估工具不随包安装）
pythonpath = ["."]
